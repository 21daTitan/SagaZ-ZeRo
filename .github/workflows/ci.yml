name: SagaZ CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Creator diagnostics
        run: python dsant.py doctor
      - name: Strict byte audit
        run: python tools/audit_bytes.py --strict
      - name: Byte compile
        run: python -m compileall -q sagaz guard morpheus
      - name: Provenance check
        run: python -m unittest tests.test_provenance -v
